# Team override for bmad-build-auto. See docs/conventions/.

[workflow]
persistent_facts = [
  "file:{project-root}/docs/conventions/naming-conventions.md",
  "file:{project-root}/docs/conventions/story-dependency-gate.md",
]

activation_steps_append = [
  "Story dependency gate: when the work is a story under _bmad-output/implementation-artifacts/stories/, apply docs/conventions/story-dependency-gate.md before step 01. If any dependency is not 'review' or 'done', write a 'blocked' terminal result that lists each blocking dependency with its status, change no other file, and HALT. An unattended run can never override the gate.",
]

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and implement it — the spec is the sole source of truth. Load every file listed in its frontmatter `context:` before you start.
> Every new file, type, method, property, field and variable must follow {project-root}/docs/conventions/naming-conventions.md: identifiers in English (use its glossary), only user-visible text in Vietnamese. Where the spec names an identifier in Vietnamese, translate it with the glossary — the naming convention wins over the spec on names. Do not rename existing code unless the spec is refactor story R.1.
>
> When done, report what you changed, how you verified it, and anything left incomplete or risky.
"""
